# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: build .NET projects

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies API
      run: dotnet restore ./BoardGameCommerceAPI/BoardGameCommerceAPI.csproj 
    - name: Build API
      run: dotnet build ./BoardGameCommerceAPI/BoardGameCommerceAPI.csproj --no-restore
    - name: Restore dependencies WebApp
      run: dotnet restore ./BoardGameCommerceWebApp/BoardGameCommerce.csproj 
    - name: Build WepApp
      run: dotnet build ./BoardGameCommerceWebApp/BoardGameCommerce.csproj --no-restore
